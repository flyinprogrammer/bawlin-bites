name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run

  deploy:
    needs: build
    # Pushes to main deploy automatically; "Run workflow" deploys whatever branch you pick.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bawls.scherger.cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # First deploy creates the "bawlin-bites" D1 database and the
      # bawls.scherger.cloud custom domain; later deploys reuse both.
      # If the ADMIN_TOKEN secret is set (GitHub → Environments → production), it is
      # uploaded as a Worker secret so the family can mark recipes tested & approved.
      - name: Deploy
        run: |
          if [ -n "$ADMIN_TOKEN" ]; then
            node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify({ ADMIN_TOKEN: process.env.ADMIN_TOKEN }))'
            npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
            rm "$RUNNER_TEMP/secrets.json"
          else
            npx wrangler deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2edf7a62c0e1f0a2704179d80bb681b8
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
